receivers:
  otlp:
    protocols:
      grpc:
        endpoint: otel-collector:4317
      http:
        endpoint: otel-collector:4318

exporters:
  debug:

processors:
  batch:

extensions:
  health_check:

service:
  extensions: [ health_check ]
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ ]
      #      exporters: [jaeger]
      exporters: [ debug ]
    metrics:
      receivers: [ otlp ]
      processors: [ ]
      exporters: [ debug ]
    logs:
      receivers: [ otlp ]
      processors: [ ]
      exporters: [ debug ]