quarkus.application.name=otel-mcp-client
quarkus.http.port=8082

# Disable OTel exporters by default (override when a collector is available)
#quarkus.otel.sdk.disabled=true

# MCP client connecting to otel-mcp-server (default port 8080)
quarkus.langchain4j.mcp.server.transport-type=streamable-http
quarkus.langchain4j.mcp.server.url=http://localhost:8080/mcp
